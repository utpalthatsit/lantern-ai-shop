# Lantern — Supabase project configuration
project_id = "lantern-ai-shop"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[functions]
enabled = true
verify_jwt = true

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = ["http://localhost:4173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[auth.phone]
enable_signup = true
enable_confirmations = false
test_otp = { enabled = true, otp = "123456" }
